name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Smoke installed console and fixtures
        run: |
          paretopilot --version
          paretopilot init launch-kit-smoke
          paretopilot ci-gate launch-kit-smoke/benchmarks/benchmark-set.json --constraints launch-kit-smoke/constraints/deployment.json --output-dir launch-kit-smoke-output --allow-synthetic --expect-selected-id q4-kleidiai
          paretopilot validate examples/synthetic-results.json
          paretopilot recommend examples/synthetic-results.json --constraints configs/constraints.example.json
          paretopilot passport examples/synthetic-results.json --constraints configs/constraints.example.json --output passport-smoke.json
          paretopilot optimization-receipt examples/synthetic-results.json --constraints configs/constraints.example.json --output optimization-receipt-smoke.md
          paretopilot validate-llama-bench tests/fixtures/llama_bench.synthetic.jsonl

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install "build>=1.2.2,<2"
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel into an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/paretopilot-wheel-smoke"
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" --version
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" assemble-capacity --help
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" bind-capacity-quality --help
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" capacity-receipt --help
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" validate \
            examples/synthetic-results.json
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" recommend \
            examples/synthetic-results.json \
            --constraints configs/constraints.example.json
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" passport \
            examples/synthetic-results.json \
            --constraints configs/constraints.example.json \
            --output "$RUNNER_TEMP/decision-passport.json"
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" optimization-receipt \
            examples/synthetic-results.json \
            --constraints configs/constraints.example.json \
            --output "$RUNNER_TEMP/optimization-receipt.md"
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" init \
            "$RUNNER_TEMP/paretopilot-launch-kit"
          "$RUNNER_TEMP/paretopilot-wheel-smoke/bin/paretopilot" ci-gate \
            "$RUNNER_TEMP/paretopilot-launch-kit/benchmarks/benchmark-set.json" \
            --constraints "$RUNNER_TEMP/paretopilot-launch-kit/constraints/deployment.json" \
            --output-dir "$RUNNER_TEMP/paretopilot-launch-kit-output" \
            --allow-synthetic \
            --expect-selected-id q4-kleidiai

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the local Action with an explicit synthetic smoke fixture
        id: decision
        uses: ./
        with:
          benchmarks: examples/synthetic-results.json
          constraints: configs/constraints.example.json
          output-dir: action-smoke-output
          require-measured: "false"
          expected-selected-id: q4-kleidiai
      - name: Verify Action outputs
        shell: bash
        env:
          SELECTED_ID: ${{ steps.decision.outputs.selected-id }}
          SYNTHETIC_SOURCE: ${{ steps.decision.outputs.synthetic-source }}
          RECOMMENDATION: ${{ steps.decision.outputs.recommendation }}
          REPORT: ${{ steps.decision.outputs.report }}
          DECISION_PASSPORT: ${{ steps.decision.outputs.decision-passport }}
          OPTIMIZATION_RECEIPT: ${{ steps.decision.outputs.optimization-receipt }}
          OPTIMIZATION_RECEIPT_SHA256: ${{ steps.decision.outputs.optimization-receipt-sha256 }}
          EVIDENCE_GRADE: ${{ steps.decision.outputs.evidence-grade }}
          RECEIPT: ${{ steps.decision.outputs.receipt }}
        run: |
          set -euo pipefail
          test "$SELECTED_ID" = "q4-kleidiai"
          test "$SYNTHETIC_SOURCE" = "true"
          test -f "$RECOMMENDATION"
          test -f "$REPORT"
          test -f "$DECISION_PASSPORT"
          test -f "$OPTIMIZATION_RECEIPT"
          test "$EVIDENCE_GRADE" = "synthetic"
          test -f "$RECEIPT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          recommendation = json.loads(Path(os.environ["RECOMMENDATION"]).read_text())
          passport = json.loads(Path(os.environ["DECISION_PASSPORT"]).read_text())
          optimization_receipt_path = Path(os.environ["OPTIMIZATION_RECEIPT"])
          optimization_receipt = optimization_receipt_path.read_text()
          receipt = json.loads(Path(os.environ["RECEIPT"]).read_text())
          assert recommendation["selected_id"] == "q4-kleidiai"
          assert passport["selected_decision"]["candidate_id"] == "q4-kleidiai"
          assert passport["evidence_grade"] == "synthetic"
          assert "Synthetic" in optimization_receipt
          assert "Measured improvement" not in optimization_receipt
          assert receipt["expectation_matched"] is True
          assert receipt["synthetic_source"] is True
          assert receipt["evidence_grade"] == "synthetic"
          assert receipt["schema_version"] == "1.2"
          assert len(receipt["decision_passport_sha256"]) == 64
          digest = hashlib.sha256(optimization_receipt_path.read_bytes()).hexdigest()
          assert digest == os.environ["OPTIMIZATION_RECEIPT_SHA256"]
          assert digest == receipt["optimization_receipt_sha256"]
          PY
      - name: Confirm measured-evidence protection fails closed
        shell: bash
        run: |
          set -euo pipefail
          if python -m paretopilot ci-gate examples/synthetic-results.json \
            --constraints configs/constraints.example.json \
            --output-dir action-guard-output
          then
            echo "synthetic evidence unexpectedly passed the measured-evidence gate" >&2
            exit 1
          fi
          test ! -e action-guard-output
