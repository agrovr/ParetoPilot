name: Arm64 capacity study

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-capacity-study-${{ github.ref }}
  cancel-in-progress: false

env:
  LC_ALL: C.UTF-8
  PYTHONPATH: ${{ github.workspace }}/src
  CAPACITY_PLAN: configs/capacity.arm64.json
  CAPACITY_PLAN_SHA256: 85cf5ecad8d3e9c8cc83f2b7fe554b913013360d6a81322305edee32e06b98db
  LOAD_PLAN: configs/load.arm64.json
  LOAD_PLAN_SHA256: b10f61b7093f58ad6d142deafd7d6befe600d1d54a433b59c101131dd8c2d9bb
  EVAL_SUITE: evals/qwen-behavior-v2.json
  EVAL_SUITE_SHA256: e49c16fba32fd65c947264aef4141026ab68b1fd415ef09eeea6e8ade9a545c7
  EVIDENCE_LOCK: results/published/30055662526/evidence.json
  EVIDENCE_LOCK_SHA256: 9a00187cb4619daec3596139c97de49127841ceb3c2c7edd85092df2474c578d
  CANONICAL_RELEASE_URL: https://github.com/agrovr/ParetoPilot/releases/download/v1.1.0/paretopilot-v1.1.0-arm64-evidence-30055662526.zip
  CANONICAL_RELEASE_SHA256: b5586878ccd214667911390f417db0417111ac2c31d163a2f5f55c4469aefeb2
  CANONICAL_RELEASE_SIZE_BYTES: "402899"
  Q8_CANONICAL_COMMAND_SHA256: 8b5040317a38b52930ab87494bb4d02aaccf696ebe7d0826df33816a3045d74f
  Q4_TUNED_CANONICAL_COMMAND_SHA256: 4e09666b2e6542694e0a96f3e20f27697a7f9202155f7b9c80658fd51ccc3487
  LLAMA_CPP_COMMIT: 67b9b0e7f6ce45d929a4411907d3c48ec719e81c
  KLEIDIAI_VERSION: v1.24.0
  KLEIDIAI_SHA256: 9348b969e042d8890a54b01a463dbe71f5a4c074b5329e9c26a85ef3b68aa19b
  KLEIDIAI_SIZE_BYTES: "2466038"
  MODEL_FAMILY: Qwen2.5-1.5B-Instruct
  MODEL_REPOSITORY: Qwen/Qwen2.5-1.5B-Instruct-GGUF
  MODEL_REVISION: 91cad51170dc346986eccefdc2dd33a9da36ead9
  Q8_FILENAME: qwen2.5-1.5b-instruct-q8_0.gguf
  Q8_SHA256: d7efb072e7724d25048a4fda0a3e10b04bdef5d06b1403a1c93bd9f1240a63c8
  Q8_SIZE_BYTES: "1894532128"
  Q4_FILENAME: qwen2.5-1.5b-instruct-q4_0.gguf
  Q4_SHA256: dcd819ff094852c38faba6873d8ff0c9d51eadb2844539e52042ae5d647bbfdb
  Q4_SIZE_BYTES: "1066227232"
  THREADS: "4"
  PER_SLOT_CONTEXT: "2048"

jobs:
  capacity:
    name: Q8 versus tuned Q4 capacity study
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300

    steps:
      - name: Check out ParetoPilot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Initialize run status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          Path("artifacts/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": "1.0",
                      "status": "incomplete",
                      "classification": "supplementary-capacity",
                      "measurement_valid": False,
                      "canonical_outputs_modified": False,
                      "reason": "capacity study has not completed",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          Path("artifacts/current-stage.txt").write_text(
              "initialized\n",
              encoding="utf-8",
          )
          PY

      - name: Validate plans, pins, and native Arm64 host
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'validating-plans-and-host' > artifacts/current-stage.txt
          for required_tool in cmake curl g++-13 gcc-13 git ninja nm pgrep python sha256sum tar; do
            command -v "$required_tool"
          done
          test -x /usr/bin/time
          printf '%s  %s\n' "$CAPACITY_PLAN_SHA256" "$CAPACITY_PLAN" | sha256sum --check
          printf '%s  %s\n' "$LOAD_PLAN_SHA256" "$LOAD_PLAN" | sha256sum --check
          printf '%s  %s\n' "$EVAL_SUITE_SHA256" "$EVAL_SUITE" | sha256sum --check
          printf '%s  %s\n' "$EVIDENCE_LOCK_SHA256" "$EVIDENCE_LOCK" | sha256sum --check
          python -m paretopilot doctor --require-evidence-host
          python - <<'PY'
          from pathlib import Path
          from paretopilot.capacity_eval import load_capacity_plan
          from paretopilot.load_eval import load_load_plan

          plan = load_capacity_plan(Path("configs/capacity.arm64.json"))
          load = load_load_plan(Path("configs/load.arm64.json"))
          if plan.client_concurrency_levels != load.concurrency_levels:
              raise SystemExit("capacity and load client-concurrency levels differ")
          PY

      - name: Capture runner identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'capturing-runner-identity' > artifacts/current-stage.txt
          mkdir -p artifacts/environment
          uname -a > artifacts/environment/uname.txt
          lscpu > artifacts/environment/lscpu.txt
          cat /etc/os-release > artifacts/environment/os-release.txt
          free -h > artifacts/environment/memory.txt
          gcc-13 --version > artifacts/environment/gcc.txt
          g++-13 --version > artifacts/environment/g++.txt
          cmake --version > artifacts/environment/cmake.txt
          ninja --version > artifacts/environment/ninja.txt
          python -m paretopilot doctor \
            --require-evidence-host \
            --output artifacts/environment/paretopilot-doctor.json

      - name: Verify and replay the v1.1 release
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'replaying-frozen-canonical-evidence' > artifacts/current-stage.txt
          archive="$RUNNER_TEMP/paretopilot-v1.1.0-arm64-evidence.zip"
          extracted="$RUNNER_TEMP/canonical-evidence"
          replayed="$RUNNER_TEMP/canonical-replay"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 5 \
            --retry-all-errors \
            --output "$archive" \
            "$CANONICAL_RELEASE_URL"
          test "$(stat --format='%s' "$archive")" = "$CANONICAL_RELEASE_SIZE_BYTES"
          printf '%s  %s\n' "$CANONICAL_RELEASE_SHA256" "$archive" | sha256sum --check
          python - "$archive" "$extracted" <<'PY'
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          from zipfile import ZipFile

          archive, destination = map(Path, sys.argv[1:])
          with ZipFile(archive) as bundle:
              members = bundle.infolist()
              if not members:
                  raise SystemExit("canonical release archive is empty")
              names = set()
              for member in members:
                  name = member.filename
                  path = PurePosixPath(name)
                  mode = member.external_attr >> 16
                  if (
                      not name
                      or "\\" in name
                      or path.is_absolute()
                      or ".." in path.parts
                      or path.as_posix() in names
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f"unsafe canonical release member: {name}")
                  names.add(path.as_posix())
              bundle.extractall(destination)
          PY
          python -m paretopilot replay "$extracted" --output-dir "$replayed"
          python - "$replayed/replay.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          replay = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = (
              "valid",
              "decision_reproduced",
              "fully_reproduced",
              "report_matches_archive",
          )
          if any(replay.get(name) is not True for name in required):
              raise SystemExit("frozen v1.1 evidence did not replay completely")
          if replay.get("selected_id") != "q8-generic":
              raise SystemExit("frozen v1.1 selected candidate changed")
          PY
          printf '%s  %s\n' \
            "$Q8_CANONICAL_COMMAND_SHA256" \
            "$extracted/experiment/candidates/q8-generic/server-command.json" \
            | sha256sum --check
          printf '%s  %s\n' \
            "$Q4_TUNED_CANONICAL_COMMAND_SHA256" \
            "$extracted/experiment/candidates/q4-kleidiai-tuned/server-command.json" \
            | sha256sum --check
          mkdir -p artifacts/canonical
          cp \
            "$archive" \
            artifacts/canonical/paretopilot-v1.1.0-arm64-evidence-30055662526.zip
          cp "$replayed/replay.json" artifacts/canonical/replay.json
          cp "$extracted/SHA256SUMS" artifacts/canonical/frozen-SHA256SUMS
          cp \
            "$extracted/experiment/candidates/q8-generic/server-command.json" \
            artifacts/canonical/q8-generic-server-command.json
          cp \
            "$extracted/experiment/candidates/q4-kleidiai-tuned/server-command.json" \
            artifacts/canonical/q4-kleidiai-tuned-server-command.json
          printf '%s  %s\n' \
            "$CANONICAL_RELEASE_SHA256" \
            "canonical/paretopilot-v1.1.0-arm64-evidence-30055662526.zip" \
            > artifacts/canonical/release-archive.sha256

      - name: Fetch pinned llama.cpp and KleidiAI sources
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'fetching-pinned-sources' > artifacts/current-stage.txt
          llama_source="$RUNNER_TEMP/llama.cpp"
          git init "$llama_source"
          git -C "$llama_source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$llama_source" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$llama_source" checkout --detach FETCH_HEAD
          test "$(git -C "$llama_source" rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"

          archive="$RUNNER_TEMP/kleidiai-${KLEIDIAI_VERSION}-src.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 30 \
            --max-time 300 \
            --retry 5 \
            --retry-all-errors \
            --output "$archive" \
            "https://github.com/ARM-software/kleidiai/releases/download/${KLEIDIAI_VERSION}/kleidiai-${KLEIDIAI_VERSION}-src.tar.gz"
          test "$(stat --format='%s' "$archive")" = "$KLEIDIAI_SIZE_BYTES"
          printf '%s  %s\n' "$KLEIDIAI_SHA256" "$archive" | sha256sum --check
          kleidiai_source="$RUNNER_TEMP/kleidiai-${KLEIDIAI_VERSION}"
          mkdir "$kleidiai_source"
          tar -xzf "$archive" --strip-components=1 -C "$kleidiai_source"
          test -f "$kleidiai_source/CMakeLists.txt"
          mkdir -p artifacts/build

      - name: Build pinned generic and KleidiAI servers
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'building-pinned-servers' > artifacts/current-stage.txt
          mkdir -p .candidate-build artifacts/build
          build_variant() {
            local label="$1"
            local enabled="$2"
            local build_dir="$GITHUB_WORKSPACE/.candidate-build/$label"
            cmake \
              -S "$RUNNER_TEMP/llama.cpp" \
              -B "$build_dir" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc-13 \
              -DCMAKE_CXX_COMPILER=g++-13 \
              -DBUILD_SHARED_LIBS=OFF \
              -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
              "-DFETCHCONTENT_SOURCE_DIR_KLEIDIAI_DOWNLOAD=$RUNNER_TEMP/kleidiai-${KLEIDIAI_VERSION}" \
              -DGGML_NATIVE=ON \
              -DGGML_CPU_REPACK=ON \
              "-DGGML_CPU_KLEIDIAI=$enabled" \
              -DGGML_BLAS=OFF \
              -DGGML_CUDA=OFF \
              -DGGML_OPENCL=OFF \
              -DGGML_RPC=OFF \
              -DGGML_VULKAN=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=ON \
              -DLLAMA_BUILD_TOOLS=ON \
              2>&1 | tee "artifacts/build/${label}-configure.log"
            cmake --build "$build_dir" \
              --target llama-server \
              --parallel "$THREADS" \
              2>&1 | tee "artifacts/build/${label}-compile.log"
            grep -Fxq "GGML_CPU_KLEIDIAI:BOOL=${enabled}" "$build_dir/CMakeCache.txt"
            cp "$build_dir/CMakeCache.txt" "artifacts/build/${label}-CMakeCache.txt"
            ldd "$build_dir/bin/llama-server" \
              > "artifacts/build/${label}-llama-server.ldd.txt"
          }
          build_variant generic OFF
          build_variant kleidiai ON
          nm -C .candidate-build/kleidiai/bin/llama-server \
            | grep -Ei "kleidiai|(^|[^a-z])kai_" \
            | head -n 500 \
            > artifacts/build/kleidiai-symbols.txt || true

      - name: Download and verify pinned Q8 and Q4 models
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'downloading-pinned-models' > artifacts/current-stage.txt
          mkdir -p .candidate-models
          fetch_model() {
            local filename="$1"
            local expected_sha="$2"
            local expected_size="$3"
            local destination="$GITHUB_WORKSPACE/.candidate-models/$filename"
            curl \
              --fail \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --connect-timeout 30 \
              --max-time 2400 \
              --retry 5 \
              --retry-all-errors \
              --output "$destination" \
              "https://huggingface.co/$MODEL_REPOSITORY/resolve/$MODEL_REVISION/$filename?download=true"
            test "$(stat --format='%s' "$destination")" = "$expected_size"
            printf '%s  %s\n' "$expected_sha" "$destination" | sha256sum --check
          }
          fetch_model "$Q8_FILENAME" "$Q8_SHA256" "$Q8_SIZE_BYTES"
          fetch_model "$Q4_FILENAME" "$Q4_SHA256" "$Q4_SIZE_BYTES"

      - name: Build capacity source manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'building-source-manifest' > artifacts/current-stage.txt
          cp "$CAPACITY_PLAN" artifacts/capacity-plan.json
          cp "$LOAD_PLAN" artifacts/load-plan.json
          cp "$EVAL_SUITE" artifacts/evaluation-suite.json
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          canonical_root = Path(os.environ["RUNNER_TEMP"]) / "canonical-evidence"
          q8_command_path = (
              canonical_root
              / "experiment/candidates/q8-generic/server-command.json"
          )
          q4_command_path = (
              canonical_root
              / "experiment/candidates/q4-kleidiai-tuned/server-command.json"
          )
          lscpu = Path("artifacts/environment/lscpu.txt").read_text(encoding="utf-8")
          match = re.search(r"^Model name:\s*(.+)$", lscpu, re.MULTILINE)
          cpu = match.group(1).strip() if match else "Arm64 CPU (see lscpu evidence)"

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload = {
              "schema_version": "1.1",
              "classification": "supplementary-capacity",
              "synthetic": False,
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "revision": os.environ["GITHUB_SHA"],
                  "workflow": ".github/workflows/capacity-study-arm64.yml",
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "generated_at_utc": dt.datetime.now(dt.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              },
              "runner": {
                  "os": "Ubuntu 24.04",
                  "architecture": "arm64",
                  "cpu": cpu,
                  "cpu_count": os.cpu_count(),
              },
              "runtime": {
                  "name": "llama.cpp",
                  "repository": "https://github.com/ggml-org/llama.cpp",
                  "revision": os.environ["LLAMA_CPP_COMMIT"],
              },
              "optimization_library": {
                  "name": "KleidiAI",
                  "repository": "https://github.com/ARM-software/kleidiai",
                  "version": os.environ["KLEIDIAI_VERSION"],
                  "source_archive_sha256": os.environ["KLEIDIAI_SHA256"],
                  "size_bytes": int(os.environ["KLEIDIAI_SIZE_BYTES"]),
              },
              "toolchain": {
                  "gcc_version_sha256": sha256(
                      Path("artifacts/environment/gcc.txt")
                  ),
                  "gxx_version_sha256": sha256(
                      Path("artifacts/environment/g++.txt")
                  ),
                  "cmake_version_sha256": sha256(
                      Path("artifacts/environment/cmake.txt")
                  ),
                  "ninja_version_sha256": sha256(
                      Path("artifacts/environment/ninja.txt")
                  ),
              },
              "candidates": {
                  "q8-generic": {
                      "model": {
                          "family": os.environ["MODEL_FAMILY"],
                          "repository": os.environ["MODEL_REPOSITORY"],
                          "revision": os.environ["MODEL_REVISION"],
                          "filename": os.environ["Q8_FILENAME"],
                          "sha256": os.environ["Q8_SHA256"],
                          "size_bytes": int(os.environ["Q8_SIZE_BYTES"]),
                      },
                      "build": {
                          "label": "generic",
                          "server_binary_sha256": sha256(
                              Path(".candidate-build/generic/bin/llama-server")
                          ),
                          "kleidiai_enabled": False,
                          "cmake_cache_sha256": sha256(
                              Path("artifacts/build/generic-CMakeCache.txt")
                          ),
                          "configure_log_sha256": sha256(
                              Path("artifacts/build/generic-configure.log")
                          ),
                          "compile_log_sha256": sha256(
                              Path("artifacts/build/generic-compile.log")
                          ),
                      },
                  },
                  "q4-kleidiai-tuned": {
                      "model": {
                          "family": os.environ["MODEL_FAMILY"],
                          "repository": os.environ["MODEL_REPOSITORY"],
                          "revision": os.environ["MODEL_REVISION"],
                          "filename": os.environ["Q4_FILENAME"],
                          "sha256": os.environ["Q4_SHA256"],
                          "size_bytes": int(os.environ["Q4_SIZE_BYTES"]),
                      },
                      "build": {
                          "label": "kleidiai",
                          "server_binary_sha256": sha256(
                              Path(".candidate-build/kleidiai/bin/llama-server")
                          ),
                          "kleidiai_enabled": True,
                          "cmake_cache_sha256": sha256(
                              Path("artifacts/build/kleidiai-CMakeCache.txt")
                          ),
                          "configure_log_sha256": sha256(
                              Path("artifacts/build/kleidiai-configure.log")
                          ),
                          "compile_log_sha256": sha256(
                              Path("artifacts/build/kleidiai-compile.log")
                          ),
                      },
                  },
              },
              "canonical_commands": {
                  "q8-generic": {
                      "sha256": sha256(q8_command_path),
                      "argv": json.loads(
                          q8_command_path.read_text(encoding="utf-8")
                      )["argv"],
                  },
                  "q4-kleidiai-tuned": {
                      "sha256": sha256(q4_command_path),
                      "argv": json.loads(
                          q4_command_path.read_text(encoding="utf-8")
                      )["argv"],
                  },
              },
              "canonical_evidence": {
                  "lock_sha256": os.environ["EVIDENCE_LOCK_SHA256"],
                  "release_sha256": os.environ["CANONICAL_RELEASE_SHA256"],
                  "run_id": "30055662526",
                  "release_tag": "v1.1.0",
              },
          }
          Path("artifacts/manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Measure the slot and client matrix in mirrored order
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'running-capacity-matrix' > artifacts/current-stage.txt
          mkdir -p artifacts/runs artifacts/quality

          run_configuration() (
            set -euo pipefail
            local pass_id="$1"
            local candidate="$2"
            local build="$3"
            local model="$4"
            local batch="$5"
            local ubatch="$6"
            local parallel="$7"
            local port="$8"
            local client_order="$9"
            local total_context=$((10#$parallel * 10#$PER_SLOT_CONTEXT))
            local directory="artifacts/runs/$pass_id/$candidate/p$parallel"
            local command_file="$directory/server-command.json"
            local stdout_file="$directory/server.stdout.log"
            local stderr_file="$directory/server.stderr.log"
            local time_file="$directory/server-time.txt"
            local load_file="$directory/load-evaluation.json"
            mkdir -p "$directory"

            python - \
              "$command_file" \
              "$build" \
              "$model" \
              "$batch" \
              "$ubatch" \
              "$parallel" \
              "$total_context" \
              "$port" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          output, build, model, batch, ubatch, parallel, context, port = sys.argv[1:]
          argv = [
              f"./.candidate-build/{build}/bin/llama-server",
              "--model", f"./.candidate-models/{model}",
              "--threads", os.environ["THREADS"],
              "--threads-batch", os.environ["THREADS"],
              "--batch-size", batch,
              "--ubatch-size", ubatch,
              "--ctx-size", context,
              "--parallel", parallel,
              "--n-gpu-layers", "0",
              "-lv", "4",
              "--host", "127.0.0.1",
              "--port", port,
          ]
          Path(output).write_text(
              json.dumps({"schema_version": "1.0", "argv": argv}, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          PY
            mapfile -t argv < <(python - "$command_file" <<'PY'
          import json
          from pathlib import Path
          import sys

          for argument in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["argv"]:
              print(argument)
          PY
            )

            /usr/bin/time -v -o "$time_file" \
              "${argv[@]}" > "$stdout_file" 2> "$stderr_file" &
            local timer_pid=$!
            local server_pid=""
            cleanup() {
              if [[ -z "$server_pid" ]]; then
                server_pid="$(pgrep -P "$timer_pid" | head -n 1 || true)"
              fi
              if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
                kill -INT "$server_pid" 2>/dev/null || true
              elif kill -0 "$timer_pid" 2>/dev/null; then
                kill -INT "$timer_pid" 2>/dev/null || true
              fi
              for _ in $(seq 1 30); do
                kill -0 "$timer_pid" 2>/dev/null || break
                sleep 1
              done
              if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
                kill -TERM "$server_pid" 2>/dev/null || true
              fi
              if kill -0 "$timer_pid" 2>/dev/null; then
                kill -TERM "$timer_pid" 2>/dev/null || true
              fi
              for _ in $(seq 1 10); do
                kill -0 "$timer_pid" 2>/dev/null || break
                sleep 1
              done
              if [[ -n "$server_pid" ]] && kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              if kill -0 "$timer_pid" 2>/dev/null; then
                kill -KILL "$timer_pid" 2>/dev/null || true
              fi
              wait "$timer_pid" 2>/dev/null || true
            }
            trap cleanup EXIT

            local ready="false"
            for _ in $(seq 1 120); do
              server_pid="$(pgrep -P "$timer_pid" | head -n 1 || true)"
              if curl --fail --silent --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" >/dev/null; then
                ready="true"
                break
              fi
              if ! kill -0 "$timer_pid" 2>/dev/null; then
                echo "::error::$candidate p$parallel server exited before health check"
                tail -n 200 "$stderr_file" || true
                exit 6
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "::error::$candidate p$parallel server did not become healthy in 120 seconds"
              echo "----- server stdout -----"
              tail -n 200 "$stdout_file" || true
              echo "----- server stderr -----"
              tail -n 200 "$stderr_file" || true
              exit 6
            fi

            python -m paretopilot evaluate-load \
              --base-url "http://127.0.0.1:${port}" \
              --candidate-id "$candidate" \
              --plan "$LOAD_PLAN" \
              --server-command "$command_file" \
              --canonical-server-command "$command_file" \
              --execution-order "$client_order" \
              --output "$load_file"
            cleanup
            trap - EXIT
            test -s "$time_file"

            if [[ "$candidate" == "q4-kleidiai-tuned" ]]; then
              grep -Fq "CPU_KLEIDIAI model buffer" "$stderr_file"
            elif grep -Fq "CPU_KLEIDIAI model buffer" "$stderr_file"; then
              echo "::error::$candidate unexpectedly recorded the KleidiAI model-buffer marker"
              exit 7
            fi
          )

          run_configuration forward q8-generic generic "$Q8_FILENAME" 512 128 1 19001 1,2,4
          sleep 5
          run_configuration forward q8-generic generic "$Q8_FILENAME" 512 128 2 19002 1,2,4
          sleep 5
          run_configuration forward q8-generic generic "$Q8_FILENAME" 512 128 4 19004 1,2,4
          sleep 5
          run_configuration forward q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 1 19101 1,2,4
          sleep 5
          run_configuration forward q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 2 19102 1,2,4
          sleep 5
          run_configuration forward q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 4 19104 1,2,4
          sleep 10

          run_configuration reverse q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 4 19204 4,2,1
          sleep 5
          run_configuration reverse q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 2 19202 4,2,1
          sleep 5
          run_configuration reverse q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 1 19201 4,2,1
          sleep 5
          run_configuration reverse q8-generic generic "$Q8_FILENAME" 512 128 4 19304 4,2,1
          sleep 5
          run_configuration reverse q8-generic generic "$Q8_FILENAME" 512 128 2 19302 4,2,1
          sleep 5
          run_configuration reverse q8-generic generic "$Q8_FILENAME" 512 128 1 19301 4,2,1

          printf '%s\n' 'running-dedicated-quality-guards' > artifacts/current-stage.txt
          sleep 10

          run_quality_configuration() (
            set -euo pipefail
            local candidate="$1"
            local build="$2"
            local model="$3"
            local batch="$4"
            local ubatch="$5"
            local parallel="$6"
            local port="$7"
            local total_context=$((10#$parallel * 10#$PER_SLOT_CONTEXT))
            local directory="artifacts/quality/$candidate/p$parallel"
            local command_file="$directory/server-command.json"
            local stdout_file="$directory/server.stdout.log"
            local stderr_file="$directory/server.stderr.log"
            local raw_evaluation="$directory/quality-evaluation.raw.json"
            local bound_evaluation="$directory/quality-evidence.json"
            mkdir -p "$directory"

            python - \
              "$command_file" \
              "$build" \
              "$model" \
              "$batch" \
              "$ubatch" \
              "$parallel" \
              "$total_context" \
              "$port" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          output, build, model, batch, ubatch, parallel, context, port = sys.argv[1:]
          argv = [
              f"./.candidate-build/{build}/bin/llama-server",
              "--model", f"./.candidate-models/{model}",
              "--threads", os.environ["THREADS"],
              "--threads-batch", os.environ["THREADS"],
              "--batch-size", batch,
              "--ubatch-size", ubatch,
              "--ctx-size", context,
              "--parallel", parallel,
              "--n-gpu-layers", "0",
              "-lv", "4",
              "--host", "127.0.0.1",
              "--port", port,
          ]
          Path(output).write_text(
              json.dumps({"schema_version": "1.0", "argv": argv}, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          PY
            mapfile -t argv < <(python - "$command_file" <<'PY'
          import json
          from pathlib import Path
          import sys

          for argument in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["argv"]:
              print(argument)
          PY
            )

            "${argv[@]}" > "$stdout_file" 2> "$stderr_file" &
            local server_pid=$!
            cleanup_quality() {
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -INT "$server_pid" 2>/dev/null || true
              fi
              for _ in $(seq 1 30); do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -TERM "$server_pid" 2>/dev/null || true
              fi
              for _ in $(seq 1 10); do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            }
            trap cleanup_quality EXIT

            local ready="false"
            for _ in $(seq 1 120); do
              if curl --fail --silent --connect-timeout 2 --max-time 5 \
                "http://127.0.0.1:${port}/health" >/dev/null; then
                ready="true"
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "::error::$candidate p$parallel quality server exited before health check"
                tail -n 200 "$stderr_file" || true
                exit 8
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "::error::$candidate p$parallel quality server did not become healthy"
              echo "----- quality server stdout -----"
              tail -n 200 "$stdout_file" || true
              echo "----- quality server stderr -----"
              tail -n 200 "$stderr_file" || true
              exit 8
            fi

            python -m paretopilot evaluate-server \
              --base-url "http://127.0.0.1:${port}" \
              --suite "$EVAL_SUITE" \
              --candidate-id "$candidate" \
              --timeout-seconds 240 \
              --output "$raw_evaluation"
            python -m paretopilot bind-capacity-quality \
              --evaluation "$raw_evaluation" \
              --server-command "$command_file" \
              --base-url "http://127.0.0.1:${port}" \
              --pass-id quality \
              --candidate-id "$candidate" \
              --server-parallel "$parallel" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$bound_evaluation"

            cleanup_quality
            trap - EXIT
            if [[ "$candidate" == "q4-kleidiai-tuned" ]]; then
              grep -Fq "CPU_KLEIDIAI model buffer" "$stderr_file"
            elif grep -Fq "CPU_KLEIDIAI model buffer" "$stderr_file"; then
              echo "::error::$candidate unexpectedly recorded the KleidiAI model-buffer marker"
              exit 9
            fi
          )

          run_quality_configuration q8-generic generic "$Q8_FILENAME" 512 128 1 19401
          sleep 5
          run_quality_configuration q8-generic generic "$Q8_FILENAME" 512 128 2 19402
          sleep 5
          run_quality_configuration q8-generic generic "$Q8_FILENAME" 512 128 4 19404
          sleep 5
          run_quality_configuration q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 1 19501
          sleep 5
          run_quality_configuration q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 2 19502
          sleep 5
          run_quality_configuration q4-kleidiai-tuned kleidiai "$Q4_FILENAME" 512 512 4 19504

      - name: Assemble capacity results
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'assembling-capacity-evidence' > artifacts/current-stage.txt
          args=(
            assemble-capacity
            --plan artifacts/capacity-plan.json
            --load-plan artifacts/load-plan.json
            --manifest artifacts/manifest.json
          )
          for pass_id in forward reverse; do
            for candidate in q8-generic q4-kleidiai-tuned; do
              for parallel in 1 2 4; do
                label="$pass_id/$candidate/p$parallel"
                directory="artifacts/runs/$pass_id/$candidate/p$parallel"
                args+=(--load "$label=$directory/load-evaluation.json")
                args+=(--rss "$label=$directory/server-time.txt")
                args+=(--server-log "$label=$directory/server.stderr.log")
              done
            done
          done
          for candidate in q8-generic q4-kleidiai-tuned; do
            for parallel in 1 2 4; do
              label="$candidate/p$parallel"
              args+=(
                --quality
                "$label=artifacts/quality/$candidate/p$parallel/quality-evidence.json"
              )
            done
          done
          python -m paretopilot "${args[@]}" \
            --output artifacts/capacity-study.json
          python -m paretopilot capacity-receipt \
            artifacts/capacity-study.json \
            --output artifacts/capacity-receipt.md

      - name: Finalize checksummed capacity bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'finalizing-checksummed-bundle' > artifacts/current-stage.txt
          python - <<'PY'
          import json
          from pathlib import Path

          study = json.loads(
              Path("artifacts/capacity-study.json").read_text(encoding="utf-8")
          )
          selected_operating_points = {}
          eligible_cell_counts = {}
          for selection in study["selections"]:
              candidate_id = selection["candidate_id"]
              selected = selection["selected_cell"]
              selected_operating_points[candidate_id] = (
                  None
                  if selected is None
                  else {
                      "server_parallel": selected["server_parallel"],
                      "client_concurrency": selected["client_concurrency"],
                  }
              )
              eligible_cell_counts[candidate_id] = selection["eligible_cell_count"]

          payload = {
              "schema_version": "1.0",
              "status": "complete",
              "classification": "supplementary-capacity",
              "measurement_valid": True,
              "canonical_outputs_modified": False,
              "eligible_cell_counts": eligible_cell_counts,
              "selected_operating_points": selected_operating_points,
              "reason": (
                  "both mirrored passes were assembled, and each cell's checks were recorded"
              ),
          }
          Path("artifacts/status.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm artifacts/current-stage.txt
          checksum_file="$RUNNER_TEMP/paretopilot-capacity-SHA256SUMS"
          (
            cd artifacts
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > "$checksum_file"
          )
          mv "$checksum_file" artifacts/SHA256SUMS

      - name: Upload validated capacity study
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supplementary-arm64-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Refresh failed status and checksums
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          stage_path = Path("artifacts/current-stage.txt")
          failed_stage = (
              stage_path.read_text(encoding="utf-8").strip()
              if stage_path.is_file()
              else "unknown"
          )
          if not failed_stage:
              failed_stage = "unknown"

          Path("artifacts/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": "1.0",
                      "status": "incomplete",
                      "classification": "incomplete",
                      "measurement_valid": False,
                      "canonical_outputs_modified": False,
                      "failed_stage": failed_stage,
                      "reason": (
                          "the Arm64 capacity study did not complete "
                          f"during {failed_stage}"
                      ),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          checksum_file="$RUNNER_TEMP/paretopilot-capacity-SHA256SUMS"
          (
            cd artifacts
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > "$checksum_file"
          )
          mv "$checksum_file" artifacts/SHA256SUMS

      - name: Upload incomplete capacity diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: INCOMPLETE-arm64-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
